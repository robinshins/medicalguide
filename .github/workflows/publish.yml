name: Publish Articles

on:
  # Re-enabled 2026-07-23 at HALF the previous volume: 24 runs/day (every 30 min)
  # → 12 runs/day (hourly). Auto-publishing had been paused after Naver search
  # exposure dropped; resuming at a lower cadence to limit risk while the
  # content-quality effect is observed.
  schedule:
    # 2026-08-04에 7회 → 2회로 축소. 이유는 비용이 아니라 SEO다 — 한 도메인이
    # 하루 7편씩 쏟아내면 색인 속도가 발행 속도를 못 따라가고 대량 자동 생성으로
    # 읽힐 위험이 있다. 번역은 그대로 12개 언어를 붙이므로 한국어 1편당 13장이
    # 나간다. 발행 편수만 줄이고 언어 커버리지는 손대지 않는다.
    # (이전 축소는 OpenAI 무료 한도 때문이었고, 그 제약은 이제 더 여유롭다.)
    - cron: '0 1 * * *'    # KST 10:00
    - cron: '0 8 * * *'    # KST 17:00
  workflow_dispatch: # Manual trigger

jobs:
  publish:
    runs-on: ubuntu-latest
    # 25, not 15. The jitter step below runs INSIDE this budget, so a 15-minute
    # timeout meant "jitter 8min + publish 6min" got killed at exactly 15:00.
    # 11 of the last 30 runs died that way — a third of the schedule wasted, and
    # each kill left the keyword at in_progress until the 1-hour reclaim swept it.
    # Publish work alone takes 3-6 min; 25 leaves room for jitter plus a slow scrape.
    timeout-minutes: 25

    steps:
      # Jitter so publishing does not hit Naver on an exact clock tick. Reduced from
      # 0-10min to 0-4min: GitHub's cron is already imprecise (often minutes late under
      # load), so a large jitter mostly just burns billable runner time doing nothing.
      - name: Random delay (0-4 min)
        run: |
          DELAY=$((RANDOM % 240))
          echo "Waiting ${DELAY}s before starting..."
          sleep $DELAY

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Create .env.local
        run: |
          cat > .env.local << 'EOF'
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL=${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY=${{ secrets.FIREBASE_PRIVATE_KEY }}
          EOF

      - name: Create Firebase service account
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > medicalkorea-2205a-firebase-adminsdk-fbsvc-70fd6e21f4.json

      - name: Publish next article
        run: node publish-action.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          CHROME_PATH: /usr/bin/google-chrome-stable
